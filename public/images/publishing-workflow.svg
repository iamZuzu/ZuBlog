<svg width="680" height="612" viewBox="0 0 680 612" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Activity sequence for publishing a post</title>
<desc>Five steps: one-time setup, write, publish, sync to GitHub, and live on Netlify.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#6b6b6b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<style>
  .th { font: 500 14px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1a1a1a; }
  .ts { font: 400 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #6b6b6b; }
  .box { fill: #f7f8fa; stroke: #cfd4dc; }
  .blue { fill: #eaf1ff; stroke: #93b8f7; }
  .arr { stroke: #9aa1ab; stroke-width: 1.5; }
</style>

<!-- Step 1: one-time setup -->
<rect x="170" y="40" width="340" height="56" rx="8" class="box" stroke-width="0.5"/>
<text class="th" x="340" y="58" text-anchor="middle" dominant-baseline="central">One-time setup</text>
<text class="ts" x="340" y="76" text-anchor="middle" dominant-baseline="central">Install Node.js, then npm install</text>
<line x1="340" y1="106" x2="340" y2="146" class="arr" marker-end="url(#arrow)"/>

<!-- Step 2: write -->
<rect x="170" y="156" width="340" height="56" rx="8" class="blue" stroke-width="0.5"/>
<text class="th" x="340" y="174" text-anchor="middle" dominant-baseline="central">Write</text>
<text class="ts" x="340" y="192" text-anchor="middle" dominant-baseline="central">npm run new-draft, then edit the file</text>
<line x1="340" y1="222" x2="340" y2="262" class="arr" marker-end="url(#arrow)"/>

<!-- Step 3: publish -->
<rect x="170" y="272" width="340" height="56" rx="8" class="blue" stroke-width="0.5"/>
<text class="th" x="340" y="290" text-anchor="middle" dominant-baseline="central">Publish</text>
<text class="ts" x="340" y="308" text-anchor="middle" dominant-baseline="central">Move the file into content/Publish</text>
<line x1="340" y1="338" x2="340" y2="378" class="arr" marker-end="url(#arrow)"/>

<!-- Step 4: sync to GitHub -->
<rect x="170" y="388" width="340" height="56" rx="8" class="blue" stroke-width="0.5"/>
<text class="th" x="340" y="406" text-anchor="middle" dominant-baseline="central">Sync to GitHub</text>
<text class="ts" x="340" y="424" text-anchor="middle" dominant-baseline="central">git push, or let auto-publish do it</text>
<line x1="340" y1="454" x2="340" y2="494" class="arr" marker-end="url(#arrow)"/>

<!-- Step 5: live -->
<rect x="170" y="504" width="340" height="56" rx="8" class="blue" stroke-width="0.5"/>
<text class="th" x="340" y="522" text-anchor="middle" dominant-baseline="central">Live</text>
<text class="ts" x="340" y="540" text-anchor="middle" dominant-baseline="central">Netlify auto-builds and deploys it</text>

<!-- Legend -->
<rect x="170" y="580" width="14" height="14" rx="3" class="box"/>
<text class="ts" x="190" y="587" dominant-baseline="central">One-time setup</text>
<rect x="330" y="580" width="14" height="14" rx="3" class="blue"/>
<text class="ts" x="350" y="587" dominant-baseline="central">Every new post</text>
</svg>

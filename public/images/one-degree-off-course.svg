<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 236" role="img" aria-label="One degree off is invisible early and decisive later" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
<rect width="760" height="236" rx="8" fill="#ffffff"/>
<text x="24" y="34" font-size="15" font-weight="600" fill="#1a1a1a">One degree off is invisible early and decisive later</text>
<line x1="60" y1="170" x2="570" y2="170" stroke="#b8b5a8" stroke-width="1.25"/>
<circle cx="570" cy="170" r="6" fill="#b8b5a8"/>
<text x="584" y="174" fill="#1a1a1a">Intended harbour</text>
<line x1="60" y1="170" x2="570" y2="90" stroke="#2b7bd9" stroke-width="2"/>
<circle cx="570" cy="90" r="6" fill="#2b7bd9"/>
<text x="584" y="94" font-weight="600" fill="#1a1a1a">Unchosen coastline</text>
<text x="96" y="150" font-size="11.5" fill="#666666">1° off</text>
<circle cx="60" cy="170" r="5" fill="#1a1a1a"/>
<text x="60" y="194" text-anchor="middle" font-size="11.5" fill="#666666">Start</text>
<line x1="170" x2="170" y1="152.75" y2="170" stroke="#b8b5a8" stroke-dasharray="3 3"/>
<text x="170" y="194" text-anchor="middle" font-size="11.5" fill="#666666">Early on: the gap is invisible</text>
<line x1="530" x2="530" y1="96.27" y2="170" stroke="#b8b5a8" stroke-dasharray="3 3"/>
<text x="530" y="194" text-anchor="end" font-size="11.5" fill="#666666">Over a lifetime: a different destination</text>
<text x="24" y="222" font-size="10.5" fill="#666666">Angle exaggerated for clarity</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 288" role="img" aria-label="Consistent small steps travel further than scattered big ones" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
<defs>
<marker id="step-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b8b5a8"/></marker>
<marker id="net-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2b7bd9"/></marker>
</defs>
<rect width="760" height="288" rx="8" fill="#ffffff"/>
<text x="24" y="34" font-size="15" font-weight="600" fill="#1a1a1a">Consistent small steps travel further than scattered big ones</text>
<text x="24" y="54" font-size="11.5" fill="#666666">Solid arrows: each stretch of effort. Dashed: where you end up.</text>
<rect x="24" y="68" width="340" height="196" rx="8" fill="none" stroke="#e2e0d8" stroke-width="1.25"/>
<text x="40" y="94" font-weight="600" fill="#1a1a1a">Intense but scattered</text>
<g fill="none" stroke="#b8b5a8" stroke-width="1.5">
<path d="M100 200L250 120" marker-end="url(#step-arrow)"/><path d="M250 120L120 130" marker-end="url(#step-arrow)"/><path d="M120 130L260 200" marker-end="url(#step-arrow)"/><path d="M260 200L170 170" marker-end="url(#step-arrow)"/>
</g>
<path d="M100 200L170 170" fill="none" stroke="#2b7bd9" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#net-arrow)"/>
<circle cx="100" cy="200" r="4" fill="#1a1a1a"/>
<text x="194" y="250" text-anchor="middle" font-size="11.5" fill="#666666">Net distance: barely moved</text>
<rect x="396" y="68" width="340" height="196" rx="8" fill="none" stroke="#e2e0d8" stroke-width="1.25"/>
<text x="412" y="94" font-weight="600" fill="#1a1a1a">Modest but consistent</text>
<g fill="none" stroke="#b8b5a8" stroke-width="1.5">
<path d="M430 215L486 180" marker-end="url(#step-arrow)"/><path d="M486 180L542 186" marker-end="url(#step-arrow)"/><path d="M542 186L598 140" marker-end="url(#step-arrow)"/><path d="M598 140L654 150" marker-end="url(#step-arrow)"/><path d="M654 150L710 114" marker-end="url(#step-arrow)"/>
</g>
<path d="M430 215L710 114" fill="none" stroke="#2b7bd9" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#net-arrow)"/>
<circle cx="430" cy="215" r="4" fill="#1a1a1a"/>
<text x="566" y="250" text-anchor="middle" font-size="11.5" fill="#666666">Net distance: far from the start</text>
</svg>
